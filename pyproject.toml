[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
name = "django-core-kit"
version = "0.1.0"
description = "Django Core Kit is a base template and toolkit designed to simplify the creation and initialization of Django projects from scratch."
authors = ["Fernando Rodriguez <ferthus@live.com>"]
license = "Apache License 2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
django = "==5.2.7"
django-environ = "*"
psycopg = { extras = ["binary"], version = "^3.2" }
redis = "*"
hiredis = "*"
django-allauth = "*"
django-tables2 = "*"
django-htmx = "*"
django-filter = "*"

[tool.poetry.group.dev.dependencies]
flake8 = "*"
pylint = "*"
pylint-django = "*"
djlint = "*"
pre-commit = "*"
django-debug-toolbar = "*"
faker = "*"
django-extensions = "*"
coverage = "*"

[tool.poetry.group.test.dependencies]
pytest = "*"
pytest-django = "*"
pytest-cov = "*"

[tool.coverage.run]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "BaseProject/settings/*",
    "BaseProject/core/settings.py",
    "BaseProject/core/urls.py"
]
