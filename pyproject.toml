[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
name = "django-core-kit"
version = "0.1.0"
description = "Django Core Kit is a base template and toolkit designed to simplify the creation and initialization of Django projects from scratch."
authors = ["Fernando Rodriguez <ferthus@live.com>"]
license = "GPLv3"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
django = "==5.2.7"
psycopg = { extras = ["binary"], version = "^3.2" }
django-environ = "==0.13.*"
redis = "==7.4.*"
hiredis = "==3.3.*"
django-allauth = "==65.16.*"
django-tables2 = "==3.0.*"
django-htmx = "==1.27.*"
django-filter = "==25.*"
djangorestframework = "==3.17.*"
djangorestframework-simplejwt = "==5.5.*"
boto3 = "==1.42.*"

[tool.poetry.group.dev.dependencies]
flake8 = "==7.3.*"
pylint = "==4.0.*"
pylint-django = "==2.7.*"
djlint = "==1.36.*"
pre-commit = "==4.5.*"
django-debug-toolbar = "==6.3.*"
faker = "==40.15.*"
django-extensions = "==4.1"
coverage = "==7.13.*"

[tool.poetry.group.test.dependencies]
pytest = "==9.0.*"
pytest-django = "==4.12.*"
pytest-cov = "==7.1.*"

[tool.coverage.run]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "BaseProject/settings/*",
    "BaseProject/core/settings.py",
    "BaseProject/core/urls.py"
]
